<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PrepIt — Chat</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/chat.css?v=2"/>
  <script src="https://cdn.jsdelivr.net/npm/marked@13/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  <script>const FEEDBACK_CHANGE_LIMIT = {{ feedback_change_limit }};</script>
  <script src="/static/js/main.js?v=12"></script>
</head>
<body>

<div x-data="chatApp()" x-init="init()" style="display:flex; flex-direction:column; height:100vh; overflow:hidden;">

  <!-- ── Sidebar backdrop (mobile only) ───────────────────── -->
  <div class="sidebar-backdrop"
       x-show="mobileSidebarOpen"
       @click="mobileSidebarOpen = false"
       x-cloak></div>

  <!-- ── App Bar ──────────────────────────────────────────── -->
  <div class="app-bar">
    <div style="display:flex; align-items:center;">
      <button class="mobile-sidebar-toggle"
              @click="mobileSidebarOpen = !mobileSidebarOpen"
              aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="logo">Prep<span>It</span></div>
    </div>
  </div>

  <!-- ── Main Layout ─────────────────────────────────────── -->
  <div class="main-layout">

    <!-- ── Sidebar ──────────────────────────────────────── -->
    <div class="sidebar" :class="{ 'collapsed': sidebarCollapsed, 'mobile-open': mobileSidebarOpen }">

      <div class="sidebar-header">
        <span class="sidebar-title">Knowledge Base</span>
        <button class="toggle-btn"
                @click="sidebarCollapsed = !sidebarCollapsed"
                :title="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
          <!-- Arrow direction flips with sidebar state -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <path x-show="!sidebarCollapsed" d="M15 18l-6-6 6-6"/>
            <path x-show="sidebarCollapsed"  d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>

      <div class="doc-list">
        <!-- Grouped by category via computed getter -->
        <template x-for="(group, gi) in groupedDocuments" :key="gi">
          <div>
            <div class="doc-category" :class="gi > 0 ? 'mt-2' : ''">
              <div class="doc-category-label" x-text="group.category"></div>
            </div>
            <template x-for="(doc, di) in group.docs" :key="di">
              <div class="doc-item">
                <svg class="doc-icon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                </svg>
                <span x-text="doc.name"></span>
              </div>
            </template>
          </div>
        </template>
      </div>

    </div>
    <!-- ── End Sidebar ───────────────────────────────────── -->

    <!-- ── Chat Panel ───────────────────────────────────── -->
    <div class="chat-panel">

      <!-- API error banner (503 / 429) -->
      <div class="error-banner"
           x-show="_errorBanner"
           x-transition:enter="transition ease-out duration-150"
           x-transition:leave="transition ease-in duration-100">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span x-text="_errorBanner"></span>
      </div>

      <!-- Context limit banner — shown when contextLimitReached is true -->
      <div class="context-banner" x-show="contextLimitReached"
           x-transition:enter="transition ease-out duration-150"
           x-transition:leave="transition ease-in duration-100">
        <div class="banner-text">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          You've reached the maximum chat context. To continue, please clear the conversation.
        </div>
        <button class="reset-btn" @click="clearChat()">Clear Chat</button>
      </div>

      <!-- ── Empty state — shown when messages array is empty ── -->
      <div class="empty-state" x-show="messages.length === 0 && !isLoading">
        <div class="empty-greeting">👋 What would you like to revise today?</div>
        <p class="empty-sub">Pick a topic below or type your own question.</p>
        <div class="empty-suggestions">
          <template x-for="(s, si) in suggestions" :key="si">
            <button class="suggestion-chip"
                    @click="sendMessage(s)"
                    :disabled="sendDisabled || isLoading"
                    x-text="s"></button>
          </template>
        </div>
      </div>

      <!-- ── Messages area — shown when messages exist ────── -->
      <div class="messages-area"
           id="messages-area"
           x-show="messages.length > 0 || isLoading">

        <template x-for="(msg, idx) in messages" :key="idx">
          <div class="message-row" :class="msg.role === 'user' ? 'user' : 'ai'">

            <!-- Message bubble -->
            <div class="message-bubble" x-html="renderContent(msg)"></div>

            <!-- Citations (AI messages only) -->
            <div class="citations"
                 x-show="msg.role === 'assistant' && msg.citations && msg.citations.length > 0">
              <template x-for="(cit, ci) in msg.citations" :key="ci">
                <div class="citation-chip">
                  <div class="citation-dot"></div>
                  <span x-text="cit.doc_name"></span>
                </div>
              </template>
            </div>

            <!-- Follow-up questions (AI messages only) -->
            <div class="followups"
                 x-show="msg.role === 'assistant' && msg.follow_up_questions && msg.follow_up_questions.length > 0">
              <div class="followup-label">Follow-up questions</div>
              <template x-for="(q, qi) in msg.follow_up_questions" :key="qi">
                <button class="followup-pill"
                        @click="sendMessage(q)"
                        :disabled="sendDisabled || isLoading"
                        x-text="q"></button>
              </template>
            </div>

            <!-- Feedback buttons (AI messages only) -->
            <div class="feedback-buttons"
                 x-show="msg.role === 'assistant'">
              <span class="feedback-label">Rate this response</span>
              <button class="feedback-btn"
                      :class="{ 'active': feedbacks[msg.id] === 'up' }"
                      @click="submitFeedback(msg.id, 'up')"
                      :disabled="msg.isHistory || !msg.id || (feedbackChanges[msg.id] || 0) >= feedbackChangeLimit"
                      title="Thumbs up"
                      aria-label="Thumbs up">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/>
                  <path d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/>
                </svg>
              </button>
              <button class="feedback-btn"
                      :class="{ 'active': feedbacks[msg.id] === 'down' }"
                      @click="submitFeedback(msg.id, 'down')"
                      :disabled="msg.isHistory || !msg.id || (feedbackChanges[msg.id] || 0) >= feedbackChangeLimit"
                      title="Thumbs down"
                      aria-label="Thumbs down">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 15v4a3 3 0 003 3l4-9V2H5.72a2 2 0 00-2 1.7l-1.38 9a2 2 0 002 2.3H10z"/>
                  <path d="M17 2h2.67A2.31 2.31 0 0122 4v7a2.31 2.31 0 01-2.33 2H17"/>
                </svg>
              </button>
            </div>

            <!-- Timestamp -->
            <div class="message-time" x-text="msg.time"></div>
          </div>
        </template>

        <!-- Typing indicator — shown while isLoading is true -->
        <div class="typing-indicator" x-show="isLoading">
          <div class="typing-bubble">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>

      </div>
      <!-- ── End Messages Area ──────────────────────────── -->

      <!-- ── Input Bar ─────────────────────────────────── -->
      <div class="input-bar">
        <textarea
          x-model="inputText"
          placeholder="Ask a question about system design, databases, AI, or DSA..."
          :disabled="sendDisabled || contextLimitReached"
          @keydown.enter.prevent="if (!$event.shiftKey) sendMessage()"
          @input="$el.style.height = 'auto'; $el.style.height = Math.min($el.scrollHeight, 160) + 'px'"
          rows="1"
        ></textarea>

        <button class="send-btn"
                @click="sendMessage()"
                :disabled="sendDisabled || isLoading || contextLimitReached || !inputText.trim()"
                x-text="sendCooldownLabel || 'Send'">
        </button>
      </div>
      <!-- ── End Input Bar ──────────────────────────────── -->

    </div>
    <!-- ── End Chat Panel ────────────────────────────────── -->

  </div>
  <!-- ── End Main Layout ───────────────────────────────────── -->

</div>
<!-- ── End Alpine root ───────────────────────────────────────── -->

</body>
</html>
