<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PrepIt — Oops</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/error.css"/>
</head>
<body>

  <div class="error-card">
    <img src="/static/img/Lost.gif" class="illustration" alt="Lost illustration"/>

    <div class="error-badge"><span class="dot"></span> Oops</div>

    <h1 class="error-heading">Looks like you're <em>lost</em></h1>

    <p class="error-subtext">
      The page you're looking for doesn't exist or you don't have permission to view it.<br/>
      If you think this is a mistake, please reach out to the Admin.
    </p>

    <a href="/" class="home-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12L12 3l9 9"/>
        <path d="M9 21V12h6v9"/>
      </svg>
      Go to Home
    </a>
  </div>

  <div class="attribution">
    <a href="https://storyset.com/woman" target="_blank" rel="noopener">Woman illustrations by Storyset</a>
  </div>

</body>
</html>
